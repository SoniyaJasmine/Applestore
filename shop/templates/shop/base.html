
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Apple Store{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'shop/css/style.css' %}">
</head>
<body>

    <header class="navbar">
        <a href="{% url 'home' %}" class="logo">Apple Store</a>

        <nav>
            <a href="{% url 'home' %}">Home</a>
            <a href="#categories">Categories</a>
            <a href="#products">Products</a>
            <a href="#products">Cart</a>
            <a href="#">Login</a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer class="footer">
        <p>Apple Store Demo · Built with Django and MySQL</p>
    </footer>

</body>
</html>
